<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas</title>
  <link rel="stylesheet" href="../css/ryanos.css" />
</head>
<body class="tile-page">
  <section class="tile simple-tile">
    <div class="tile-hero" id="christmasCountdown">---</div>
    <div class="tile-status">🌲 Christmas Vacation 🌲</div>
    <div class="tile-note">Friday, December 18</div>
  </section>
  <script>
  const christmasDate = new Date("2026-12-19T00:00:00");

  function updateChristmasCountdown() {
    const now = new Date();
    const millisecondsPerDay = 1000 * 60 * 60 * 24;
    const difference = christmasDate - now;
    const daysRemaining = Math.max(
      0,
      Math.ceil(difference / millisecondsPerDay)
    );

    document.getElementById("christmasCountdown").textContent =
      `${daysRemaining} DAYS`;
  }

  updateChristmasCountdown();
  setInterval(updateChristmasCountdown, 60 * 60 * 1000);
</script>
</body>
</html>
