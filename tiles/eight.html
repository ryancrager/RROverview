<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Click</title>
  <link rel="stylesheet" href="../css/ryanos.css" />
</head>
<body class="tile-page">
  <section class="tile simple-tile">
    <div class="tile-hero" id="clickerCountdown">---</div>
    <div class="tile-status"> Click 'the button' </div>
    <div class="tile-note">March 17, 2028/div>
  </section>
  <script>
  const christmasDate = new Date("2028-03-17T00:00:00");

  function updateChristmasCountdown() {
    const now = new Date();
    const millisecondsPerDay = 1000 * 60 * 60 * 24;
    const difference = christmasDate - now;
    const daysRemaining = Math.max(
      0,
      Math.ceil(difference / millisecondsPerDay)
    );

    document.getElementById("clickerCountdown").textContent =
      `${daysRemaining} DAYS`;
  }

  updateclickerCountdown();
  setInterval(updateclickerCountdown, 60 * 60 * 1000);
</script>
</body>
</html>
